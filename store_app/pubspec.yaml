name: store_app
description: "Smart Inventory & Sales Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # State Management
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  rxdart: ^0.28.0

  # Navigation
  go_router: ^14.3.0

  # UI Components
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.1.2

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Utils
  intl: ^0.20.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.0

  # PDF & Export
  pdf: ^3.11.1
  printing: ^5.13.2
  csv: ^6.0.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Icons
  material_design_icons_flutter: ^7.0.7296

  # Date & Time
  table_calendar: ^3.1.2

  # Responsive layout
  responsive_framework: ^1.4.0
  flutter_staggered_grid_view: ^0.7.0

  # Image
  image_picker: ^1.1.2

  # Storage
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3

  # Barcode/QR
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # HTTP
  http: ^1.2.2
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
